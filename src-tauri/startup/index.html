<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pocket Agent</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0a0a0a;
        color: #f4f4f5;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }
      .card {
        max-width: 420px;
        text-align: center;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.75rem;
      }
      p {
        font-size: 0.9rem;
        line-height: 1.5;
        color: #a1a1aa;
        margin: 0 0 1rem;
      }
      .spinner {
        width: 40px;
        height: 40px;
        margin: 0 auto 1.25rem;
        border: 3px solid #3f3f46;
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      code {
        font-size: 0.8rem;
        background: #18181b;
        padding: 0.15rem 0.35rem;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div class="card" id="card">
      <div class="spinner" id="spinner"></div>
      <h1 id="title">Starting Pocket Agent…</h1>
      <p id="message">
        Installing and launching your private Pocket Node. This only happens on
        first open and usually takes a few seconds.
      </p>
    </div>
  </body>
</html>
