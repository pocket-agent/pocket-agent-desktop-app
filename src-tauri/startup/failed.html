<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pocket Agent — setup failed</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0a0a0a;
        color: #f4f4f5;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }
      .card {
        max-width: 440px;
        text-align: center;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.75rem;
      }
      p {
        font-size: 0.9rem;
        line-height: 1.5;
        color: #a1a1aa;
        margin: 0 0 1rem;
      }
      code {
        font-size: 0.8rem;
        background: #18181b;
        padding: 0.15rem 0.35rem;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Couldn’t start Pocket Agent</h1>
      <p>
        The bundled Pocket Node did not come online. Try quitting and opening
        Pocket Agent again. If this keeps happening, reinstall from the latest
        <code>.dmg</code> or check logs at
        <code>~/.pocket-agent/logs/bundle-serve.log</code>.
      </p>
    </div>
  </body>
</html>
